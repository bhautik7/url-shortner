events {
    worker_connections 10240;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream Write Service instances (can be scaled with docker compose up --scale write_service=N)
    upstream write_service_upstream {
        server write_service:8001;
        keepalive 32;
    }

    # Upstream Read Service instances (can be scaled with docker compose up --scale read_service=N)
    upstream read_service_upstream {
        server read_service:8002;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # Generate X-Request-ID if not supplied by client
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Pass X-Request-ID back in downstream response
        add_header X-Request-ID $req_id always;

        # -------------------------------------------------------------
        # Route 1: URL Creation (Write Service)
        # -------------------------------------------------------------
        location /api/v1/urls {
            proxy_pass http://write_service_upstream;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # -------------------------------------------------------------
        # Route 2: Health & Readiness Probes
        # -------------------------------------------------------------
        location /health/write {
            proxy_pass http://write_service_upstream/health;
        }

        location /ready/write {
            proxy_pass http://write_service_upstream/ready;
        }

        location /health {
            proxy_pass http://read_service_upstream/health;
        }

        location /ready {
            proxy_pass http://read_service_upstream/ready;
        }

        # -------------------------------------------------------------
        # Route 3: URL Redirection (Read Service)
        # Catches GET /{short_code}
        # -------------------------------------------------------------
        location / {
            proxy_pass http://read_service_upstream;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }
    }
}
